# Referencia de /etc/nginx/conf.d/playa.conf (lo genera deploy/setup.sh)
upstream playa {
    server 127.0.0.1:3002;
    keepalive 16;
}

server {
    server_name playa-auto.ewardevs.site;

    access_log /var/log/nginx/playa.access.log;
    error_log  /var/log/nginx/playa.error.log;

    client_max_body_size 100M;

    root /var/www/playa/public;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        try_files $uri @app;
    }

    location @app {
        proxy_pass http://playa;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    listen 80;
    listen [::]:80;
}
