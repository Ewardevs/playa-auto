<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>Página no encontrada</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@600&family=Public+Sans:wght@400;500&display=swap">
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
        padding: 2rem; background: #faf9f7; color: #1a1c1f;
        font-family: "Public Sans", ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card { max-width: 30rem; text-align: center; }
      .mark {
        display: grid; place-items: center; width: 3.25rem; height: 3.25rem; margin: 0 auto 1.75rem;
        border-radius: .5rem; background: #14523c; color: #fff;
      }
      .code {
        font-family: ui-monospace, "SF Mono", monospace; font-size: .6875rem;
        letter-spacing: .14em; text-transform: uppercase; color: #14523c; margin: 0 0 .75rem;
      }
      h1 {
        font-family: "Familjen Grotesk", sans-serif; font-weight: 600; font-size: 1.875rem;
        line-height: 1.15; letter-spacing: -.02em; margin: 0;
      }
      p { color: #6d6a64; line-height: 1.6; margin: .875rem 0 0; }
      .actions { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; margin-top: 2rem; }
      a {
        display: inline-flex; align-items: center; height: 2.75rem; padding: 0 1.25rem;
        border-radius: .375rem; font-size: .875rem; font-weight: 500; text-decoration: none;
        border: 1px solid transparent; transition: background-color .15s, border-color .15s;
      }
      .primary { background: #14523c; color: #fff; }
      .primary:hover { background: #0e3d2c; }
      .secondary { border-color: #e5e1d9; color: #1a1c1f; }
      .secondary:hover { background: #f3f1ed; }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="mark" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 17h2v-5l-2.5-5.5A2 2 0 0 0 16.7 5H7.3a2 2 0 0 0-1.8 1.5L3 12v5h2m14 0a2 2 0 1 1-4 0m4 0a2 2 0 1 0-4 0m-6 0a2 2 0 1 1-4 0m4 0a2 2 0 1 0-4 0m-2-5h16"/>
        </svg>
      </span>

      <p class="code">Error 404</p>
      <h1>No encontramos esta página</h1>
      <p>Es posible que el vehículo ya no esté disponible o que el enlace haya cambiado.</p>

      <div class="actions">
        <a class="primary" href="/vehiculos">Ver vehículos</a>
        <a class="secondary" href="/">Volver al inicio</a>
      </div>
    </main>
  </body>
</html>
